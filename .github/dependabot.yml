version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # react and its type packages stay on the 18/19 baseline the react-floor job needs, so a major bump is a manual decision;
    # only major is blocked, minor and patch still land so security fixes get through
    ignore:
      - dependency-name: react
        update-types:
          - version-update:semver-major
      - dependency-name: react-dom
        update-types:
          - version-update:semver-major
      - dependency-name: "@types/react"
        update-types:
          - version-update:semver-major
      - dependency-name: "@types/react-dom"
        update-types:
          - version-update:semver-major
      # a typescript major has to wait for typescript-eslint to widen its peer range (currently >=4.8.4 <6.1.0),
      # otherwise the upgrade PR fails with ERESOLVE during npm ci; major is blocked here too
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    # dev dependencies grouped so a week's updates arrive as one PR
    groups:
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
