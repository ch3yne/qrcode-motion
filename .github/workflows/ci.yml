name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Coverage
        run: npm run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

      - name: Build library and assert artifacts
        run: npm run build:lib

      - name: Lint package and types
        run: npm run check:package

      - name: Check bundle size
        run: npm run size

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org

      - name: Build demo
        run: npm run build:demo

  react-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - name: Install the react 18 peer floor
        run: npm install --no-save --no-package-lock react@18 react-dom@18 @types/react@18 @types/react-dom@18

      - name: Typecheck against react 18 types
        run: npm run typecheck

      - name: Test against react 18
        run: npm run test

      - name: Build library against react 18
        run: npm run build:lib
