name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Coverage
        run: npm run test:coverage

      - name: Build library and assert artifacts
        run: npm run build:lib

      - name: Lint package and types
        run: npm run check:package

      - name: Check bundle size
        run: npm run size

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org

      - name: Verify tag matches package version
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          version="$(node -p "require('./package.json').version")"
          if ! test "${tag}" = "v${version}"; then
            echo "tag ${tag} does not name the packaged version ${version} (expected v${version})" >&2
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
